[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intern-portfolio"
version = "1.0.0"
description = "Runnable AI product / Agent / workflow portfolio using synthetic data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Portfolio" }]
keywords = ["ai-product", "rag", "agent", "workflow", "portfolio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
ai-portfolio = "ai_portfolio.cli:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["ai_portfolio*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ["py310"]
